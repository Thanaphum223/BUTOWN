server:
  forward-headers-strategy: native
  port: ${PORT:8080}
  address: ${BIND_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: strict
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55432/towntrack}
    username: ${DB_USER:towntrack}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
towntrack:
  files: ${FILE_ROOT:./private-files}
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}
