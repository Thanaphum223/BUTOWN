services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: towntrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-towntrack.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d towntrack"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  clamav:
    image: clamav/clamav:stable
    environment:
      CLAMD_CONF_StreamMaxLength: 1024M
      CLAMD_CONF_MaxFileSize: 1024M
      CLAMD_CONF_MaxScanSize: 2048M
      CLAMD_CONF_MaxScanTime: "600000"
      CLAMD_CONF_AlertExceedsMax: "yes"
    volumes:
      - clamdata:/var/lib/clamav
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/towntrack
      DB_USER: towntrack
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD}
      BIND_ADDRESS: 0.0.0.0
      COOKIE_SECURE: "true"
      FILE_ROOT: /data/files
      CLAMAV_HOST: clamav
      GEOCODING_BASE_URL: ${GEOCODING_BASE_URL:-}
      MAPBOX_PUBLIC_TOKEN: ${MAPBOX_PUBLIC_TOKEN:-}
      MAPBOX_GEOCODING_TOKEN: ${MAPBOX_GEOCODING_TOKEN:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      GOV_AUTH_MODE: ${GOV_AUTH_MODE:-local}
      IAM_API_URL: ${IAM_API_URL:-https://api-auth.govcenter.co}
      IAM_GOV_FRONTEND_URL: ${IAM_GOV_FRONTEND_URL:-https://auth.govcenter.co}
      E_SERVICE_CODE: ${E_SERVICE_CODE:-}
      E_SERVICE_API_KEY: ${E_SERVICE_API_KEY:-}
      GOV_CALLBACK_URL: ${GOV_CALLBACK_URL:-}
      GOV_MUNICIPALITY_ID: ${GOV_MUNICIPALITY_ID:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      S3_REGION: ${S3_REGION:-ap-southeast-1}
      PRIVACY_NOTICE_VERSION: ${PRIVACY_NOTICE_VERSION:-local-test-v1}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:-}
      LINE_LIFF_ID: ${LINE_LIFF_ID:-}
      LINE_MUNICIPALITY_ID: ${LINE_MUNICIPALITY_ID:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  pgdata:
  files:
  clamdata:
