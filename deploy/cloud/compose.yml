name: towntrack
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '2'
services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging
  frontend:
    image: towntrack-frontend:${RELEASE_SHA:?Set RELEASE_SHA}
    environment:
      TRUSTED_PROXY_HOST: gateway
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped
    logging: *logging
  backend:
    image: towntrack-backend:${RELEASE_SHA:?Set RELEASE_SHA}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/towntrack
      DB_USER: towntrack
      BIND_ADDRESS: 0.0.0.0
      COOKIE_SECURE: 'true'
      FILE_ROOT: /data/files
      CLAMAV_HOST: clamav
      DEV_UNSCANNED_FILES: 'false'
      JAVA_TOOL_OPTIONS: '-Xms64m -Xmx192m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m -XX:+UseSerialGC'
    volumes: ['files:/data/files']
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: towntrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    command: ['postgres', '-c', 'shared_buffers=32MB', '-c', 'work_mem=1MB', '-c', 'max_connections=25']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-towntrack.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d towntrack']
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    environment:
      CLAMD_CONF_MaxThreads: '1'
      CLAMD_CONF_StreamMaxLength: 1024M
      CLAMD_CONF_MaxFileSize: 1024M
      CLAMD_CONF_MaxScanSize: 2048M
      CLAMD_CONF_MaxScanTime: '600000'
      CLAMD_CONF_AlertExceedsMax: 'yes'
    volumes: ['clamdata:/var/lib/clamav']
    logging: *logging
volumes:
  pgdata:
  files:
  clamdata:
  caddy_data:
  caddy_config:
