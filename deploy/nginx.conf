limit_req_zone $binary_remote_addr zone=towntrack:10m rate=15r/s;
server {
 listen 80;
 server_tokens off;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 12m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.line-scdn.net https://d.line-scdn.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://*.line-scdn.net; connect-src 'self' https://api.line.me https://access.line.me https://*.line-scdn.net; frame-src https://access.line.me; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
 location /api/ {
  limit_req zone=towntrack burst=30 nodelay;
  proxy_pass http://backend:8080;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 60s;
 }
 location / { try_files $uri $uri/ /index.html; }
}
