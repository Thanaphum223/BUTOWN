name: Build and deploy TownTrack
on:
  workflow_run:
    workflows: ['Verify TownTrack']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: towntrack-cloud-test
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: cloud-test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # Forks and backup copies have no deployment secrets: skip instead of failing, and before
      # spending runner minutes on image builds.
      - name: Check deployment settings
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$SSH_KEY" ] && [ -n "$KNOWN_HOSTS" ]; then
            echo "DEPLOY_READY=true" >> "$GITHUB_ENV"
          else
            echo "::notice::Deployment secrets are not set for this repository; skipping deploy."
          fi
      - name: Resolve release
        if: env.DEPLOY_READY == 'true'
        run: echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build runtime images
        if: env.DEPLOY_READY == 'true'
        run: |
          docker build -f deploy/Dockerfile.backend -t "towntrack-backend:$RELEASE_SHA" .
          docker build -f deploy/Dockerfile.frontend -t "towntrack-frontend:$RELEASE_SHA" .
      - name: Configure SSH
        if: env.DEPLOY_READY == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Transfer and deploy verified release
        if: env.DEPLOY_READY == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -o pipefail
          docker image save "towntrack-backend:$RELEASE_SHA" "towntrack-frontend:$RELEASE_SHA" |
            gzip -1 |
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -i ~/.ssh/deploy_key "root@$DEPLOY_HOST" "$RELEASE_SHA"
      - name: Check public HTTPS endpoint
        if: env.DEPLOY_READY == 'true'
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: curl --fail --retry 12 --retry-delay 10 --retry-all-errors "${DEPLOY_URL%/}/healthz"
      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
